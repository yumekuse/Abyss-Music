[package]
name = "abyss"
version = "0.3.1"
edition = "2024"
description = "abyss - a fast, ad-free YouTube Music player for your desktop"
license = "MIT"
repository = "https://github.com/yumekuse/Abyss-Music"
readme = "README.md"
build = "build.rs"

[dependencies]
tao = "0.37.3"
wry = "0.57.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "brotli", "http2"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.2"
sha1 = "0.11.0"
base64 = "0.23.1"
aes-gcm = "0.11.1"
urlencoding = "2.1.3"
any_ascii = "0.3.3"
pinyin = "0.11.0"
wana_kana = "5.0.0"
discord-rich-presence = "1.1.0"
open = "5.4.5"
futures = "0.3"
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }  # Windows' own TLS (fast, no extra code)
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }  # no OpenSSL needed: one binary for every distro

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# Debian / Ubuntu / Kali package (built in CI with cargo-deb)
[package.metadata.deb]
name = "abyss-music"
maintainer = "yumekuse"
section = "sound"
priority = "optional"
extended-description = "abyss plays YouTube Music through the official player in a tiny native window: synced lyrics, romaji, themes, Discord status, offline downloads and your own YouTube Music library."
depends = "$auto, libwebkit2gtk-4.1-0, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
assets = [
  ["target/release/abyss", "usr/bin/abyss", "755"],
  ["packaging/linux/abyss.desktop", "usr/share/applications/abyss.desktop", "644"],
  ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/abyss.png", "644"],
]
